<script type="module">
import * as THREE from 'three';
import { createGolem } from '../src/golem.js';
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(1200, 700); document.body.appendChild(r.domElement);

  r.setViewport(i * 400, 0, 400, 700); r.setScissor(i * 400, 0, 400, 700); r.render(s, c);
});
window.done = true;
